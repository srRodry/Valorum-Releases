name: Pixel Code presentation

on:
  push:
    branches: [main]
    paths:
      - update.json
      - assets/**
      - scripts/sync_presentation.py
      - .github/workflows/sync-presentation.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pixel-code-presentation
  cancel-in-progress: false

jobs:
  presentation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Sync verified download links and release identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/sync_presentation.py --publish
      - name: Save current download information
        run: |
          if ! git diff --quiet -- README.md docs/DOWNLOADS.md; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add README.md docs/DOWNLOADS.md
            git commit -m "docs: sync verified Valorum download links"
            git push origin HEAD:main
          fi
